name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/limitless-pendant-dashboard-1VPg1
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages via API
        uses: actions/github-script@v7
        with:
          script: |
            // First try to enable Pages with branch-based deployment
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: { branch: 'gh-pages', path: '/' }
              });
              console.log('Pages enabled with gh-pages branch');
            } catch (e) {
              if (e.status === 409) {
                console.log('Pages already enabled');
              } else {
                console.log('Warning:', e.message);
              }
            }

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
